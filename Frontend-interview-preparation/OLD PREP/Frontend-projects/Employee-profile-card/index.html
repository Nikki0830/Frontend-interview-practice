<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="profile-card">
        
        <h1>Employee Profile</h1>

        <p>Name: <span id="employeeName">Nikita</span></p>
        <p>Role: <span id="employeeRole">Frontend Developer</span></p>
        <p>Salary: ₹<span id="salary">35000</span></p>
        <p>Status: <span id="status">Active</span></p>

        <button id="updateButton">Give Salary Increment</button>
    </main>
</body>

</html>
